name: Validation CI

on:
  push:
    paths:
      - '.github/workflows/validation-package-ci.yml'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dependency-cruiser.mjs'
  pull_request:
    paths:
      - '.github/workflows/validation-package-ci.yml'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dependency-cruiser.mjs'

permissions:
  contents: read

concurrency:
  group: validation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter @scoops/validation check:code

      - name: Check architecture
        run: pnpm --filter @scoops/validation check:architecture

      - name: Check types
        run: pnpm --filter @scoops/validation check:types
