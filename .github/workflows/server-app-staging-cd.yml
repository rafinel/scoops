name: Server Heroku CD

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/server-app-staging-cd.yml"
      - "apps/server/**"
      - "package.json"
      - "packages/core/**"
      - "packages/email/**"
      - "packages/validation/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/sync-heroku-env.mjs"

permissions:
  contents: read

concurrency:
  group: server-heroku-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      HEROKU_APP_NAME: scoops-server-app-staging
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

    steps:
      - name: Checkout revision
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_SERVER_STAGING_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          test -n "$HEROKU_APP_NAME"
          test -n "$HEROKU_API_KEY"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
          test -n "$SENTRY_AUTH_TOKEN"

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Authenticate with Heroku Container Registry
        run: heroku container:login

      - name: Sync server environment
        env:
          HEROKU_ENV_FILE: ${{ secrets.SCOOPS_SERVER_APP_STAGING_ENV }}
        run: |
          test -n "$HEROKU_ENV_FILE"
          env_file="$RUNNER_TEMP/server.env"
          printf '%s' "$HEROKU_ENV_FILE" > "$env_file"
          if grep -Eq '^[[:space:]]*(export[[:space:]]+)?SENTRY_AUTH_TOKEN[[:space:]]*=' "$env_file"; then
            echo 'SENTRY_AUTH_TOKEN must be supplied as a BuildKit secret, never a runtime setting.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(export[[:space:]]+)?SCOOPS_RELEASE_SHA[[:space:]]*=' "$env_file"; then
            echo 'SCOOPS_RELEASE_SHA is set by the deployed image and must not override its release.' >&2
            exit 1
          fi
          chmod 600 "$env_file"
          node scripts/sync-heroku-env.mjs "$env_file" "$HEROKU_APP_NAME" "$GITHUB_ENV"

      - name: Validate server runtime and release configuration
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_SERVER_STAGING_PROJECT }}
        run: |
          test "$SCOOPS_SERVER_APP_MODE" = stg
          test -n "$SENTRY_DSN"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"

      - name: Build and push server images
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_SERVER_STAGING_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --target runtime \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg "SCOOPS_SERVER_APP_MODE=stg" \
            --build-arg "SENTRY_ORG=$SENTRY_ORG" \
            --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT" \
            --build-arg "SCOOPS_RELEASE_SHA=$GITHUB_SHA" \
            --tag "registry.heroku.com/$HEROKU_APP_NAME/web" \
            --file apps/server/Dockerfile \
            .
          docker push "registry.heroku.com/$HEROKU_APP_NAME/web"
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --target release \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg "SCOOPS_SERVER_APP_MODE=stg" \
            --build-arg "SENTRY_ORG=$SENTRY_ORG" \
            --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT" \
            --build-arg "SCOOPS_RELEASE_SHA=$GITHUB_SHA" \
            --tag "registry.heroku.com/$HEROKU_APP_NAME/release" \
            --file apps/server/Dockerfile \
            .
          docker push "registry.heroku.com/$HEROKU_APP_NAME/release"

      - name: Release server
        run: heroku container:release web release --app "$HEROKU_APP_NAME"
