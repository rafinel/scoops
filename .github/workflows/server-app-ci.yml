name: Server CI

on:
  push:
    paths:
      - '.github/workflows/server-app-ci.yml'
      - 'apps/server/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/server-app-ci.yml'
      - 'apps/server/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INNGEST_BASE_URL: http://127.0.0.1:8288
      SUPABASE_URL: http://127.0.0.1:54321

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter server check:code

      - name: Check types
        run: pnpm --filter server check:types

      - name: Configure Supabase test keys
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const crypto = require('node:crypto')

          const secret = 'scoops-local-jwt-secret-at-least-32-characters'
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url')
          const sign = (role) => {
            const now = Math.floor(Date.now() / 1000)
            const header = encode({ alg: 'HS256', typ: 'JWT' })
            const payload = encode({
              aud: 'authenticated',
              exp: now + 3600,
              iat: now,
              iss: 'supabase',
              role,
            })
            const input = `${header}.${payload}`
            const signature = crypto.createHmac('sha256', secret).update(input).digest('base64url')
            return `${input}.${signature}`
          }

          console.log(`SUPABASE_ANON_KEY=${sign('anon')}`)
          console.log(`SUPABASE_SERVICE_ROLE_KEY=${sign('service_role')}`)
          NODE

      - name: Start Supabase gateway
        run: docker compose up -d supabase-gateway

      - name: Wait for Supabase gateway
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:54321/auth/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs supabase-gateway supabase-auth
          exit 1

      - name: Run tests
        run: pnpm --filter server test

      - name: Build
        run: pnpm --filter server build
