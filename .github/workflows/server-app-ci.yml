name: Server CI

on:
  push:
    paths:
      - '.github/workflows/server-app-ci.yml'
      - 'apps/server/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/write-coverage-report.mjs'
      - '.dependency-cruiser.mjs'
  pull_request:
    paths:
      - '.github/workflows/server-app-ci.yml'
      - 'apps/server/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/write-coverage-report.mjs'
      - '.dependency-cruiser.mjs'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INNGEST_BASE_URL: http://127.0.0.1:8288
      SCOOPS_PDV_PREVIEW_TOKEN_SECRET: scoops-ci-preview-token-secret-at-least-32-characters
      BETTER_AUTH_SECRET: scoops-ci-better-auth-secret-at-least-32-characters
      EMAIL_FROM: no-reply@scoops.local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter server check:code

      - name: Check architecture
        run: pnpm --filter server check:architecture

      - name: Check types
        run: pnpm --filter server check:types

      - name: Run tests with coverage
        id: coverage
        run: pnpm --filter server test:coverage

      - name: Write Server coverage report
        if: always() && hashFiles('apps/server/coverage/coverage-summary.json') != ''
        run: node scripts/write-coverage-report.mjs server apps/server/coverage/coverage-summary.json apps/server/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}

      - name: Publish Server coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('apps/server/coverage/coverage-comment.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report:server -->'
            const body = fs.readFileSync('apps/server/coverage/coverage-comment.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id })
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              })
            }

      - name: Upload Server coverage artifact
        if: always() && hashFiles('apps/server/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ github.run_id }}
          path: apps/server/coverage/
          retention-days: 14

      - name: Build
        run: pnpm --filter server build
