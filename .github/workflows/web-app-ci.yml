name: Web CI

on:
  push:
    paths:
      - '.github/workflows/web-app-ci.yml'
      - 'apps/web/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/write-coverage-report.mjs'
      - '.dependency-cruiser.mjs'
  pull_request:
    paths:
      - '.github/workflows/web-app-ci.yml'
      - 'apps/web/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/write-coverage-report.mjs'
      - '.dependency-cruiser.mjs'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Check code
        run: pnpm --filter web check:code

      - name: Check architecture
        run: pnpm --filter web check:architecture

      - name: Check types
        run: pnpm --filter web check:types

      - name: Run tests with coverage
        id: coverage
        run: pnpm --filter web test:coverage

      - name: Write Web coverage report
        if: always() && hashFiles('apps/web/coverage/coverage-summary.json') != ''
        run: node scripts/write-coverage-report.mjs web apps/web/coverage/coverage-summary.json apps/web/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}

      - name: Publish Web coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('apps/web/coverage/coverage-comment.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report:web -->'
            const body = fs.readFileSync('apps/web/coverage/coverage-comment.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id })
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              })
            }

      - name: Upload Web coverage artifact
        if: always() && hashFiles('apps/web/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ github.run_id }}
          path: apps/web/coverage/
          retention-days: 14

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run mocked route tests
        run: pnpm --filter web exec playwright test tests/routes --workers=1

      - name: Build
        run: pnpm --filter web build
