name: Web CI

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/web-app-staging-cd.yml"
      - ".github/workflows/web-app-ci.yml"
      - ".code-multivitals-baseline.json"
      - ".code-multivitals.json"
      - "apps/web/**"
      - "biome.json"
      - "package.json"
      - "packages/core/**"
      - "packages/validation/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/check-complexity.mjs"
      - "scripts/sync-heroku-env.mjs"
      - "scripts/write-coverage-report.mjs"
      - ".dependency-cruiser.mjs"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web_code:
    name: Web code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SCOOPS_SERVER_APP_URL: http://127.0.0.1:3336
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Check code
        run: pnpm --filter web check:code

  web_architecture:
    name: Web architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SCOOPS_SERVER_APP_URL: http://127.0.0.1:3336
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Check architecture
        run: pnpm --filter web check:architecture

  web_types:
    name: Web types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SCOOPS_SERVER_APP_URL: http://127.0.0.1:3336
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Check types
        run: pnpm --filter web check:types

  web_coverage:
    name: Web unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SCOOPS_SERVER_APP_URL: http://127.0.0.1:3336
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Run tests with coverage
        id: coverage
        run: pnpm --filter web test:coverage

      - name: Write Web coverage report
        if: always() && hashFiles('apps/web/coverage/coverage-summary.json') != ''
        run: node scripts/write-coverage-report.mjs web apps/web/coverage/coverage-summary.json apps/web/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}

      - name: Publish Web coverage on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('apps/web/coverage/coverage-comment.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report:web -->'
            const body = fs.readFileSync('apps/web/coverage/coverage-comment.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id })
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              })
            }

      - name: Upload Web coverage artifact
        if: always() && hashFiles('apps/web/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ github.run_id }}
          path: apps/web/coverage/
          retention-days: 14

  web_integration:
    name: Web browser integration (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      VITE_SCOOPS_SERVER_APP_URL: http://127.0.0.1:3336
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run browser integration tests
        run: pnpm --filter web test:integration --shard=${{ matrix.shard }}/4 --workers=1

  web_build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SCOOPS_SERVER_APP_URL: http://127.0.0.1:3336
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Build
        run: pnpm --filter web build

  web:
    name: Web
    if: ${{ always() }}
    needs:
      - web_code
      - web_architecture
      - web_types
      - web_coverage
      - web_integration
      - web_build
    runs-on: ubuntu-latest
    steps:
      - name: Require all Web checks
        env:
          WEB_CODE_RESULT: ${{ needs.web_code.result }}
          WEB_ARCHITECTURE_RESULT: ${{ needs.web_architecture.result }}
          WEB_TYPES_RESULT: ${{ needs.web_types.result }}
          WEB_COVERAGE_RESULT: ${{ needs.web_coverage.result }}
          WEB_INTEGRATION_RESULT: ${{ needs.web_integration.result }}
          WEB_BUILD_RESULT: ${{ needs.web_build.result }}
        run: |
          if [[ "$WEB_CODE_RESULT" != "success" || "$WEB_ARCHITECTURE_RESULT" != "success" || "$WEB_TYPES_RESULT" != "success" || "$WEB_COVERAGE_RESULT" != "success" || "$WEB_INTEGRATION_RESULT" != "success" || "$WEB_BUILD_RESULT" != "success" ]]; then
            echo "Web code result: $WEB_CODE_RESULT"
            echo "Web architecture result: $WEB_ARCHITECTURE_RESULT"
            echo "Web types result: $WEB_TYPES_RESULT"
            echo "Web coverage result: $WEB_COVERAGE_RESULT"
            echo "Web integration result: $WEB_INTEGRATION_RESULT"
            echo "Web build result: $WEB_BUILD_RESULT"
            exit 1
          fi

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        run: pnpm --filter web check:complexity
