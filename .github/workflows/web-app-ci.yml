name: Web CI

on:
  push:
    paths:
      - '.github/workflows/web-app-ci.yml'
      - 'apps/web/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/web-app-ci.yml'
      - 'apps/web/**'
      - 'biome.json'
      - 'package.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm --filter web generate-routes

      - name: Check code
        run: pnpm --filter web check:code

      - name: Check types
        run: pnpm --filter web check:types

      - name: Run tests
        run: pnpm --filter web test

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run browser integration tests
        run: pnpm --filter web test:integration

      - name: Build
        run: pnpm --filter web build
