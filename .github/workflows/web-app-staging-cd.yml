name: Web Heroku CD

# Staging deployment is intentionally triggered by pushes to main.
on:
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/web-app-staging-cd.yml'
      - 'apps/web/**'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/validation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/sync-heroku-env.mjs'

permissions:
  contents: read

concurrency:
  group: web-heroku-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      HEROKU_APP_NAME: scoops-web-app-staging
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

    steps:
      - name: Checkout revision
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_STAGING_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          test -n "$HEROKU_APP_NAME"
          test -n "$HEROKU_API_KEY"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
          test -n "$SENTRY_AUTH_TOKEN"

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Authenticate with Heroku Container Registry
        run: heroku container:login

      - name: Load and sync web environment
        env:
          HEROKU_ENV_FILE: ${{ secrets.SCOOPS_WEB_APP_STAGING_ENV }}
        run: |
          test -n "$HEROKU_ENV_FILE"
          env_file="$RUNNER_TEMP/web.env"
          printf '%s' "$HEROKU_ENV_FILE" > "$env_file"
          printf '\nSCOOPS_RELEASE_SHA=%s\nVITE_SCOOPS_RELEASE_SHA=%s\n' \
            "$GITHUB_SHA" "$GITHUB_SHA" >> "$env_file"
          chmod 600 "$env_file"
          node scripts/sync-heroku-env.mjs "$env_file" "$HEROKU_APP_NAME" "$GITHUB_ENV"

      - name: Validate web build environment
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_STAGING_PROJECT }}
        run: |
          test -n "$VITE_SCOOPS_SERVER_APP_URL"
          test -n "$VITE_SCOOPS_SERVER_API_PREFIX"
          test -n "$SCOOPS_SERVER_PROXY_URL"
          test "$SCOOPS_WEB_APP_MODE" = stg
          test "$VITE_SCOOPS_WEB_APP_MODE" = stg
          test -n "$SENTRY_DSN"
          test -n "$VITE_SENTRY_DSN"
          test "$VITE_SENTRY_DSN" = "$SENTRY_DSN"
          test "$SCOOPS_RELEASE_SHA" = "$GITHUB_SHA"
          test "$VITE_SCOOPS_RELEASE_SHA" = "$GITHUB_SHA"
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"

      - name: Build and push web image
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_STAGING_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --target runtime \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg "VITE_SCOOPS_SERVER_APP_URL=$VITE_SCOOPS_SERVER_APP_URL" \
            --build-arg "VITE_SCOOPS_SERVER_API_PREFIX=$VITE_SCOOPS_SERVER_API_PREFIX" \
            --build-arg "VITE_SCOOPS_WEB_APP_MODE=$VITE_SCOOPS_WEB_APP_MODE" \
            --build-arg "VITE_SENTRY_DSN=$VITE_SENTRY_DSN" \
            --build-arg "VITE_SCOOPS_RELEASE_SHA=$VITE_SCOOPS_RELEASE_SHA" \
            --build-arg "SENTRY_ORG=$SENTRY_ORG" \
            --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT" \
            --build-arg "SCOOPS_SERVER_PROXY_URL=$SCOOPS_SERVER_PROXY_URL" \
            --tag "registry.heroku.com/$HEROKU_APP_NAME/web" \
            --file apps/web/Dockerfile \
            .
          docker push "registry.heroku.com/$HEROKU_APP_NAME/web"

      - name: Release web
        run: heroku container:release web --app "$HEROKU_APP_NAME"
