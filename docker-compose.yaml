services:
  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: scoops-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-scoops-local-jwt-secret-at-least-32-characters}
      JWT_EXP: ${JWT_EXP:-3600}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - scoops-supabase-db-data:/var/lib/postgresql/data
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scoops

  supabase-auth:
    image: supabase/gotrue:v2.189.0
    container_name: scoops-supabase-auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      mailpit:
        condition: service_started
      auth-templates:
        condition: service_started
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://127.0.0.1:54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_URI_ALLOW_LIST:-http://127.0.0.1:3000}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-scoops-local-jwt-secret-at-least-32-characters}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL:-http://127.0.0.1:54321}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@scoops.local}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Scoops}
      GOTRUE_MAILER_TEMPLATES_INVITE: http://auth-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://auth-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://auth-templates/magic_link.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://auth-templates/email_change.html
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scoops

  supabase-rest:
    image: postgrest/postgrest:v14.12
    container_name: scoops-supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_JWT_SECRET: ${JWT_SECRET:-scoops-local-jwt-secret-at-least-32-characters}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - scoops

  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: scoops-supabase-meta
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-scoops-local-pg-meta-key-change-me}
    networks:
      - scoops

  supabase-studio:
    image: supabase/studio:2026.07.07-sha-a6a04f2
    container_name: scoops-supabase-studio
    restart: unless-stopped
    depends_on:
      supabase-meta:
        condition: service_started
    ports:
      - "${STUDIO_PORT:-54323}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: supabase-db
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-scoops-local-pg-meta-key-change-me}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Scoops}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-Scoops Local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AUTH_JWT_SECRET: ${JWT_SECRET:-scoops-local-jwt-secret-at-least-32-characters}
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/platform/profile'').then((r) => { if (r.status !== 200) throw new Error(r.status) })"',
        ]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - scoops

  supabase-gateway:
    image: kong/kong:3.9.1
    container_name: scoops-supabase-gateway
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    ports:
      - "${SUPABASE_PORT:-54321}:8000"
    volumes:
      - ./volumes/kong/kong.yml:/home/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    networks:
      - scoops

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: scoops-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-54325}:1025"
      - "${MAILPIT_UI_PORT:-54324}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - scoops

  minio:
    image: quay.io/minio/minio:latest
    container_name: scoops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scoops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scoops-local-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - scoops-minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scoops

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: scoops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scoops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scoops-local-minio-password}
      S3_BUCKET: ${S3_BUCKET:-scoops}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"
    networks:
      - scoops

  auth-templates:
    image: nginx:1.27-alpine
    container_name: scoops-auth-templates
    restart: unless-stopped
    volumes:
      - ./volumes/auth/templates:/usr/share/nginx/html:ro
    networks:
      - scoops

  inngest:
    image: inngest/inngest:v1.36.0
    container_name: scoops-inngest
    restart: unless-stopped
    command: inngest dev --no-discovery
    ports:
      - "${INNGEST_PORT:-8298}:8288"
      - "${INNGEST_CONNECT_PORT:-8299}:8289"
    volumes:
      - scoops-inngest-data:/tmp/inngest
    networks:
      - scoops

volumes:
  scoops-supabase-db-data:
    name: scoops-supabase-db-data
  scoops-inngest-data:
    name: scoops-inngest-data
  scoops-minio-data:
    name: scoops-minio-data

networks:
  scoops:
    name: scoops
