services:
  postgres:
    image: postgres:17-alpine
    container_name: scoops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - scoops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [scoops]

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: scoops-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-54325}:1025"
      - "${MAILPIT_UI_PORT:-54324}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks: [scoops]

  minio:
    image: quay.io/minio/minio:latest
    container_name: scoops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scoops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scoops-local-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - scoops-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [scoops]

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: scoops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scoops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scoops-local-minio-password}
      S3_BUCKET: ${S3_BUCKET:-scoops}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"
    networks: [scoops]

  inngest:
    image: inngest/inngest:v1.36.0
    container_name: scoops-inngest
    restart: unless-stopped
    command: inngest dev --no-discovery -u http://host.docker.internal:${SCOOPS_SERVER_APP_PORT:-3336}/api/inngest
    ports:
      - "${INNGEST_PORT:-8298}:8288"
      - "${INNGEST_CONNECT_PORT:-8299}:8289"
    volumes:
      - scoops-inngest-data:/tmp/inngest
    networks: [scoops]

volumes:
  scoops-postgres-data:
    name: scoops-postgres-data
  scoops-inngest-data:
    name: scoops-inngest-data
  scoops-minio-data:
    name: scoops-minio-data

networks:
  scoops:
    name: scoops
